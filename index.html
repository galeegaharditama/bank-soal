<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Question Bank · Manage</title>
  <link rel="stylesheet" href="src/presentation/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Question Bank</h1>
    <nav>
      <a href="quiz.html">Open quiz</a>
      <button id="sign-out" class="link" hidden type="button">Sign out</button>
    </nav>
  </header>

  <main>
    <section id="login-view" hidden>
      <form id="login-form" class="card narrow">
        <h2>Sign in</h2>
        <p class="muted">Use the editor account created in Supabase → Authentication.</p>
        <label>Email <input id="login-email" type="email" autocomplete="username" required /></label>
        <label>Password <input id="login-password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="app-view" hidden>
      <form id="editor-form" class="card">
        <h2 id="editor-title">Add question</h2>

        <div class="grid-2">
          <label>Subject <input id="subject" list="subject-options" required /></label>
          <datalist id="subject-options"></datalist>
          <label>Topic <input id="topic" placeholder="e.g. fractions" /></label>
          <label>Type
            <select id="type">
              <option value="multiple_choice">Multiple choice</option>
              <option value="short_answer">Short answer</option>
            </select>
          </label>
        </div>

        <label>Question <textarea id="prompt" rows="3" required></textarea></label>

        <div id="option-fields" class="grid-2">
          <label>Option A <input id="option-a" /></label>
          <label>Option B <input id="option-b" /></label>
          <label>Option C <input id="option-c" /></label>
          <label>Option D <input id="option-d" /></label>
        </div>

        <div class="grid-2">
          <label>Answer <input id="answer" placeholder="A / B / C / D" required /></label>
          <label>Image <input id="image" type="file" accept="image/*" /></label>
        </div>

        <label>Explanation <textarea id="explanation" rows="2"></textarea></label>

        <div class="row">
          <button type="submit" id="save">Add question</button>
          <button type="button" id="cancel" class="secondary" hidden>Cancel edit</button>
        </div>
      </form>

      <section class="card">
        <div class="row between">
          <h2>Questions <span id="count" class="muted"></span></h2>
          <select id="subject-filter"><option value="">All subjects</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Subject</th><th>Topic</th><th>Question</th><th>Type</th><th></th></tr>
            </thead>
            <tbody id="question-rows"></tbody>
          </table>
        </div>
      </section>
    </section>

    <p id="status" class="status" hidden></p>
  </main>

  <script type="module" src="src/presentation/manage.js"></script>
</body>
</html>
